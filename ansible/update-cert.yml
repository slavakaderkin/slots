---
- name: Update cert files
  hosts: all
  vars_files:
    - group_vars/all/vars.yml

  tasks:
    - name: Sync only cert files
      synchronize:
        src: "{{ local_path }}/application/cert/"
        dest: "{{ remote_path }}/application/cert/"
        archive: yes
        recursive: yes
        owner: yes
        group: yes
        mode: push
        delete: yes
        rsync_opts:
          - "--chmod=755"
      become: yes


    - name: Show update info
      debug:
        msg: "Cert files updated on {{ inventory_hostname }}"